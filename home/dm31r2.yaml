substitutions:
  devicename: dm31r2
  upper_devicename: DM31R2
  device_friendly_name: "DM31R2 2 Relays"
  blue_led_pin: D4
  sensor_pin: D2
  binary_sensor_id: "inverter"
  threshold_sensor_id: "adc0"
  threshold_update_interval: "500ms"
  threshold_sensor_name: "Inverter"
  threshold_value: "0.45"

esphome: !include ../base/device_friendly_name.yaml
esp8266: !include ../esp8266/d1mini.yaml
wifi: !include ../connection/wifi.yaml
mqtt:
    <<: !include ../connection/mqtt.yaml
# Enable logging
logger: !include ../logger/debug.yaml
# Expose some info to HA
text_sensor:
  - <<: !include ../text_sensor/wifi_info.yaml
ota: !include ../ota/esphome.yaml
# Enable remote restart from HA
button:
  - <<: !include ../button/restart.yaml
light: !include ../light/blue_led.yaml
output: !include ../output/blue_led.yaml
sensor:
  - <<: !include ../sensor/adc_for_threshold.yaml
binary_sensor:
  - <<: !include ../binary_sensor/analog_threshold.yaml
switch:
  - <<: !include ../switch/gpio5_relay_1.yaml
  - <<: !include ../switch/gpio4_relay_2.yaml
script:
  - id: turn_on_inverter
    then:
      - if:
          condition:
            binary_sensor.is_off: ${binary_sensor_id}
          then:
            script.execute: toggle_inverter
  - id: toggle_inverter
    then:
      - switch.turn_on: "relay_2"
      - delay: 1s
      - switch.turn_off: "relay_2"
interval:
  - interval: 1min
    then:
      - if:
          condition:
            mqtt.connected:
          else:
            script.execute: turn_on_inverter
            
    

